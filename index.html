<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
    <title>Specific Data Finder (ELITEKAMRUL)</title>
    <link rel="stylesheet" href="styles.css?v=20261111-3">
</head>
<body>
    <div id="login-section" class="login-container">
        <center><h1 style="color: red;">ADMIN</h1></center>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
        <button onclick="checkPassword()">Login</button>
    </div>

    <div id="data-finder-section" class="card" style="display:none;">
        <h1>
            <span class="specific">SPECIFIC</span>
            <span class="data">DATA</span>
            <span class="finder">FINDER</span>
        </h1>
        <label for="searchInput">Search for:</label>
        <input type="text" id="searchInput" placeholder="Enter Anything...">
        <div id="load-progress" class="load-progress" hidden>
            <div class="progress-info">
                <span id="progress-text">Loading data...</span>
                <span id="progress-percent">0%</span>
            </div>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>
        <ul id="results"></ul>
        <div id="buttons">
            <button onclick="search()">Get Data</button>
            <button onclick="saveData()">Save Data</button>
        </div>
    </div>

    <script src="script.js?v=20261111-3"></script>
</body>
</html>
